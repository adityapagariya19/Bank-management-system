server.port=8080
spring.application.name=meridian

# ---------------- MySQL ----------------
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates/updates the tables, then db-extras.sql adds views + indexes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
sspring.sql.init.schema-locations=optional:classpath:db-extras.sql
spring.sql.init.continue-on-error=true

# ---------------- Security ----------------
app.jwt.secret=bu4gDC5AlXJWi7QSilRry9HOY2AxT2DPcAdRWAl6/ZGfXAcYVm5U2oD05pLQYmja
app.jwt.expiration-ms=43200000
app.cors.origins=http://localhost:5173,http://localhost:3000

# ---------------- Business rules ----------------
app.limits.per-transaction=100000
app.limits.daily=200000
app.otp.expiry-minutes=5

# Simulated SMS / e-mail gateway: OTPs are stored in the message_outbox table and shown in the
# in-app "Simulated Inbox". Set to false when a real SMS/e-mail provider is connected.
app.dev-inbox.enabled=true
